name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        shell: powershell
        run: .\scripts\setup.ps1 -Python (Get-Command python).Source
      - name: Offline tests and real MCP process
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: CLI help and config generator
        run: |
          .\.venv\Scripts\python.exe -m mail263 --help
          .\.venv\Scripts\python.exe -m mail263 mcp-config
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt .
      - run: python -m unittest discover -s tests -v
